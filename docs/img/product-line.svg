<text x="96" y="224">OpenCounsel</text><text x="249.6" y="220">SVRF</text><text x="403.2" y="220">Drain</text><text x="556.8" y="220">Meton-QS</text><text x="710.4" y="220">Nexus</text><text x="864" y="220">Saga / MUD</text>
