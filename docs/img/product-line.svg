<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="t d">
<title id="t">The product line: one core, several spore-grown products</title>
<desc id="d">One core (Nym, the organism, heal and spore) grows six products: OpenCounsel, the commercial flagship for filing release and drained checks; SVRF, the public merge train; the drain, which turns AI calls into rules; Meton-QS, the operator surface; the nexus; and the saga and MUD operator view.</desc>
<style>
svg{color:#0F1D33}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.mut{fill:#56647A}.card{fill:#F6F8FB;stroke:#D5DCE6}.hi{fill:#FFFFFF;stroke:#B07D1F}.acc{fill:#B07D1F}.accS{stroke:#B07D1F}
.rule{stroke:#D5DCE6}.inv{fill:#FFFFFF}.bar{fill:#B07D1F}.core{fill:#0F1D33}.coreT{fill:#FFFFFF}.coreM{fill:#B9C5D6}
@media (prefers-color-scheme:dark){svg{color:#E6ECF4}.mut{fill:#9CA9BB}.card{fill:#141D2A;stroke:#2A374A}.hi{fill:#161F2C;stroke:#E0B25A}.acc{fill:#E0B25A}.accS{stroke:#E0B25A}.rule{stroke:#2A374A}.inv{fill:#0F1D33}.bar{fill:#E0B25A}.core{fill:#E6ECF4}.coreT{fill:#0F1D33}.coreM{fill:#3D4A5E}}
</style>
<text x="24" y="36" font-size="20" font-weight="700" fill="currentColor">One core, one product line</text>
<text x="24" y="60" font-size="13" class="mut">Each product is a demand family regrown from the same spore.</text>
<rect x="340" y="80" width="280" height="62" rx="12" class="core"/>
